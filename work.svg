<svg width="360" height="34" viewBox="0 0 360 34" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Selected work</title>
  <desc id="desc">A monochrome section label reading SELECTED WORK.</desc>
  <style>
    /* black / white / quiet signal — matches title.svg */
    .bg { fill: #000000; }
    .frame { fill: none; stroke: #ffffff; stroke-opacity: 0.14; }

    .label {
      fill: #ffffff;
      font: 800 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 3.5px;
      animation: pulse 2.8s ease-in-out infinite;
    }
    .rule {
      stroke: #ffffff;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 6 10;
      stroke-opacity: 0.28;
      animation: scan 2.6s linear infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }
    @keyframes scan {
      to { stroke-dashoffset: -32; }
    }

    @media (prefers-reduced-motion: reduce) {
      .label, .rule { animation: none; }
    }
  </style>

  <rect class="bg" width="360" height="34" rx="8"/>
  <rect class="frame" x="0.5" y="0.5" width="359" height="33" rx="7.5"/>

  <path class="rule" d="M28 17H104"/>
  <!-- letter-spacing pads the right edge of the run, so nudge the anchor left
       by half a space to keep the label optically centred -->
  <text x="178" y="22" text-anchor="middle" class="label">SELECTED WORK</text>
  <path class="rule" d="M256 17H332"/>
</svg>
