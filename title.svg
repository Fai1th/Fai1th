<svg width="720" height="110" viewBox="0 0 720 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated Fai1th.exe title</title>
  <desc id="desc">A monochrome animated terminal title reading Fai1th.exe with a blinking cursor.</desc>
  <style>
    /* black / white / quiet signal */
    .bg { fill: #000000; }
    .frame { fill: none; stroke: #ffffff; stroke-opacity: 0.14; }

    .text {
      fill: #ffffff;
      font: 800 58px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.28));
    }
    .sub {
      fill: #a8a8a8;
      font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    /* The cursor rides inside the text run so it stays glued to the last glyph,
       whichever monospace font the reader actually has. */
    .cursor { animation: blink 1.06s steps(1, end) infinite; }

    .scan {
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 10 16;
      stroke-opacity: 0.18;
      animation: scan 2.6s linear infinite;
    }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scan {
      to { stroke-dashoffset: -52; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor, .pulse, .scan { animation: none; }
    }
  </style>

  <rect class="bg" width="720" height="110" rx="12"/>
  <rect class="frame" x="0.5" y="0.5" width="719" height="109" rx="11.5"/>

  <text x="360" y="64" text-anchor="middle" class="text pulse">Fai1th.exe<tspan class="cursor">█</tspan></text>
  <path class="scan" d="M40 84H680"/>
  <text x="360" y="100" text-anchor="middle" class="sub">chmod +x ./becoming</text>
</svg>
